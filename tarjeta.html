<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A0A0A">
<title>Mi tarjeta de puntos</title>
<style>
:root{--bg:#0A0A0A;--panel:#151515;--border:#262626;--text:#E8E8E8;--muted:#9A9A9A;--accent:#FF3145;color-scheme:dark;}
@media (prefers-color-scheme:light){:root{--bg:#F5F5F4;--panel:#FFFFFF;--border:#E4E4E1;--text:#1A1A1A;--muted:#6B6B6B;color-scheme:light;}}
*{box-sizing:border-box;margin:0;}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;}
main{max-width:430px;margin:0 auto;display:grid;gap:18px;}
.center{display:grid;place-items:center;text-align:center;min-height:60dvh;gap:10px;color:var(--muted);}
.center h1{font-size:20px;color:var(--text);}
.card-wrap{display:grid;justify-items:center;animation:rise .45s cubic-bezier(.16,1,.3,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
section{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;}
h2{font-size:15px;font-weight:800;margin-bottom:10px;}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;}
.rw{padding:12px 0;border-top:1px solid var(--border);display:grid;gap:8px;}
.rw:first-of-type{border-top:0;padding-top:0;}
.rw b{font-size:14px;}.rw small{color:var(--muted);font-size:12px;}
.bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;}
button{font:inherit;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:700;font-size:13.5px;cursor:pointer;touch-action:manipulation;}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;}
button:disabled{opacity:.45;cursor:not-allowed;}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.code{font-size:30px;font-weight:800;letter-spacing:.18em;text-align:center;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-variant-numeric:tabular-nums;}
.mv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-top:1px solid var(--border);}
.mv:first-of-type{border-top:0}.mv small{color:var(--muted);display:block;font-size:11.5px;}
.plus{color:#22C55E;font-weight:800}.minus{color:var(--accent);font-weight:800}
.note{font-size:12px;color:var(--muted);line-height:1.55;}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.34,1.32,.64,1);max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.spin{display:grid;gap:12px;justify-items:center;text-align:center}
.prize{font-size:22px;font-weight:800;color:var(--accent);min-height:30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="center" id="loading">Cargando tu tarjeta…</div></main>
<div class="toast" id="toast" role="status"></div>
<script src="/kartta-card.js"></script>
<script type="module">
import { sb, imageUrl } from "/supabase-init.js";
const $ = (id) => document.getElementById(id);
const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200); };
const fmt = (n) => Number(n || 0).toLocaleString('es-CO');
const ERR = { insufficient_points: 'Aún no tienes puntos suficientes para este premio.', too_many_pending: 'Ya tienes 3 canjes pendientes. Muéstralos en el local primero.', reward_not_available: 'Ese premio ya no está disponible.', already_played: 'Ya jugaste hoy. ¡Vuelve mañana!', disabled: 'Esta función no está activa por ahora.' };
const errMsg = (e) => { const m = String(e?.message || ''); for (const k in ERR) if (m.includes(k)) return ERR[k]; return 'No se pudo completar. Intenta de nuevo.'; };
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const token = (new URLSearchParams(location.search).get('t') || (location.pathname.match(/^\/t\/([^/?#]+)/) || [])[1] || '').trim();
const KIND = { earn: 'Compra', welcome: 'Bienvenida', redeem: 'Canje', refund: 'Devolución', adjust: 'Ajuste', game: 'Ruleta' };
let data = null;

function bad(title, msg) { $('app').innerHTML = ''; const d = document.createElement('div'); d.className = 'center'; const h = document.createElement('h1'); h.textContent = title; const p = document.createElement('p'); p.textContent = msg; d.append(h, p); $('app').appendChild(d); }

async function load() {
  if (!UUID.test(token)) return bad('Enlace no válido', 'Pídele al restaurante que te reenvíe el enlace de tu tarjeta.');
  const { data: d, error } = await sb.rpc('get_loyalty_card', { p_token: token });
  if (error) return bad('No pudimos cargar tu tarjeta', 'Revisa tu conexión e intenta de nuevo.');
  if (!d) return bad('Tarjeta no disponible', 'El enlace no existe o el programa de puntos está desactivado.');
  data = d; try { localStorage.setItem('kartta_card_' + d.restaurant.slug, token); } catch {}
  document.title = 'Mi tarjeta · ' + d.restaurant.name; render();
}

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function section(title) { const s = el('section'); s.appendChild(el('h2', null, title)); return s; }

function render() {
  const d = data, app = $('app'); app.innerHTML = '';
  const rewards = d.rewards || [], bal = d.customer.balance;
  const next = (rewards.find(r => r.cost_points > bal) || rewards[rewards.length - 1] || {}).cost_points || 0;
  const wrap = el('div', 'card-wrap'); app.appendChild(wrap);
  KARTTA_CARD.render(wrap, { design: d.program.card, programName: d.program.name, restaurantName: d.restaurant.name, logoUrl: d.restaurant.logo_path ? imageUrl(d.restaurant.logo_path) : '', customerName: d.customer.name, last4: d.customer.phone_last4, balance: bal, nextCost: next });

  if ((d.pending || []).length) {
    const s = section('Canjes por entregar'); s.appendChild(el('p', 'note', 'Muestra este código en el local para recibir tu premio.'));
    d.pending.forEach(p => { const w = el('div', 'rw'); w.appendChild(el('b', null, p.reward)); w.appendChild(el('div', 'code', p.code)); s.appendChild(w); });
    app.appendChild(s);
  }
  if (d.spin && d.spin.enabled) {
    const s = section('Ruleta diaria'); const w = el('div', 'spin');
    w.appendChild(el('p', 'note', 'Un giro gratis al día. Premios posibles: ' + (d.spin.prizes || []).join(' · ')));
    const out = el('div', 'prize'); out.id = 'prize'; const b = el('button', 'main', d.spin.played_today ? 'Ya jugaste hoy' : 'Girar ruleta'); b.disabled = !!d.spin.played_today;
    b.onclick = async () => { b.disabled = true; b.textContent = 'Girando…'; const { data: r, error } = await sb.rpc('loyalty_play_spin', { p_token: token }); if (error) { toast(errMsg(error)); await load(); return; } out.textContent = '🎉 ' + r.label; toast('+' + r.points + ' puntos'); setTimeout(load, 1800); };
    w.append(b, out); s.appendChild(w); app.appendChild(s);
  }
  const rs = section('Premios'); if (!rewards.length) rs.appendChild(el('p', 'note', 'El restaurante aún no ha publicado premios.'));
  rewards.forEach(r => {
    const w = el('div', 'rw'), top = el('div', 'row'); const l = el('div'); l.appendChild(el('b', null, r.name)); if (r.description) { l.appendChild(el('br')); l.appendChild(el('small', null, r.description)); }
    const can = bal >= r.cost_points, btn = el('button', can ? 'main' : '', can ? 'Canjear' : fmt(r.cost_points) + ' pts'); btn.disabled = !can;
    btn.onclick = async () => { if (!confirm('¿Canjear «' + r.name + '» por ' + fmt(r.cost_points) + ' puntos?')) return; btn.disabled = true; const { data: x, error } = await sb.rpc('loyalty_request_redemption', { p_token: token, p_reward: r.id }); if (error) { toast(errMsg(error)); btn.disabled = false; return; } toast('Canje listo. Código: ' + x.code); await load(); };
    top.append(l, btn); w.appendChild(top);
    if (!can) { const bar = el('div', 'bar'), i = el('i'); i.style.width = Math.min(100, Math.round(bal / r.cost_points * 100)) + '%'; bar.appendChild(i); w.appendChild(bar); }
    rs.appendChild(w);
  });
  app.appendChild(rs);
  const ms = section('Mis movimientos'); if (!(d.movements || []).length) ms.appendChild(el('p', 'note', 'Todavía no tienes movimientos.'));
  (d.movements || []).forEach(m => { const r = el('div', 'mv'), l = el('div'); l.appendChild(document.createTextNode((KIND[m.kind] || m.kind) + (m.note && m.kind !== 'earn' ? ' · ' + m.note : ''))); l.appendChild(el('small', null, new Date(m.at).toLocaleString('es-CO', { timeZone: 'America/Bogota', dateStyle: 'medium', timeStyle: 'short' }))); r.append(l, el('span', m.points > 0 ? 'plus' : 'minus', (m.points > 0 ? '+' : '') + fmt(m.points))); ms.appendChild(r); });
  app.appendChild(ms);
  const tools = section('Guarda tu tarjeta'); tools.appendChild(el('p', 'note', 'Este enlace es tu tarjeta: guárdalo en tu celular. En iPhone: Compartir → «Añadir a pantalla de inicio». En Android: menú ⋮ → «Añadir a pantalla de inicio». No lo compartas: quien lo tenga puede ver tus puntos.'));
  const row = el('div', 'row'); row.style.marginTop = '12px';
  const cp = el('button', null, 'Copiar mi enlace'); cp.onclick = async () => { try { await navigator.clipboard.writeText(location.origin + '/t/' + token); toast('Enlace copiado.'); } catch { toast(location.origin + '/t/' + token); } };
  const mn = el('a'); mn.href = '/m/' + encodeURIComponent(d.restaurant.slug); mn.textContent = 'Ver el menú'; mn.style.cssText = 'color:var(--accent);font-weight:700;font-size:13.5px'; row.append(cp, mn); tools.appendChild(row); app.appendChild(tools);
  if (d.program.terms) { const t = section('Condiciones'); t.appendChild(el('p', 'note', d.program.terms)); app.appendChild(t); }
}
load();
</script>
</body>
</html>
