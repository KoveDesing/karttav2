<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Editor visual — KARTTA</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=DM+Sans:wght@600&family=Playfair+Display:wght@600&family=Lora:wght@600&family=Space+Grotesk:wght@600&display=swap">
<style>
:root{--bg:#EEEEEC;--panel:#fff;--panel2:#F3F3F1;--text:#3C3C3C;--strong:#0A0A0A;--muted:#7A7A76;--border:#E3E3DF;--accent:#FF3145;--accent-soft:rgba(255,49,69,.12);--ok:#1EA35A;--warn:#B45309;--rail:#16161A;--railtx:#B9B9B4;}
@media (prefers-color-scheme:dark){:root{--bg:#0B0B0C;--panel:#17171A;--panel2:#212125;--text:#C8C8C4;--strong:#fff;--muted:#8D8D88;--border:#2A2A2E;--accent-soft:rgba(255,49,69,.22);--warn:#F59E0B;--rail:#0E0E10}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:Inter,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
a{color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);z-index:90;text-align:center;padding:24px}#gate.hidden{display:none}
#app{height:100%;display:none;flex-direction:column}#app.ready{display:flex}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);min-height:56px}
.top .back{font-weight:700;color:var(--muted);padding:8px 10px;border-radius:10px;text-decoration:none;white-space:nowrap}.top .back:hover{background:var(--panel2);color:var(--strong)}
.top h1{font-size:15px;margin:0 auto 0 4px;color:var(--strong);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top h1 small{color:var(--muted);font-weight:600;margin-left:6px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;color:var(--strong);flex-shrink:0}.ib:disabled{opacity:.35;cursor:default}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{min-height:32px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{min-height:40px;padding:0 16px;border-radius:10px;font-weight:800;font-size:13px;border:1px solid var(--border);background:var(--panel2);color:var(--strong);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.block{width:100%}.btn:disabled{opacity:.5;cursor:default}
#saveState{font-size:12px;color:var(--muted);max-width:260px;line-height:1.25;text-align:right}#saveState.err{color:#E5484D;font-weight:700}#saveState b{color:var(--ok)}
.clean{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}.clean input{accent-color:var(--accent);width:16px;height:16px}
.banner{padding:9px 14px;background:var(--accent-soft);color:var(--strong);font-size:13px;display:none;align-items:center;gap:10px;flex-wrap:wrap}.banner.show{display:flex}
.wrap{flex:1;display:flex;min-height:0}
/* barra lateral de iconos (estilo Canva) */
.rail{width:84px;background:var(--rail);display:flex;flex-direction:column;align-items:stretch;padding:8px 0;gap:2px;overflow-y:auto;flex-shrink:0}
.rail button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;color:var(--railtx);font-size:11px;font-weight:700;border-left:3px solid transparent}
.rail button svg{width:24px;height:24px}
.rail button:hover{color:#fff;background:rgba(255,255,255,.06)}
.rail button[aria-pressed="true"]{color:#fff;background:rgba(255,255,255,.1);border-left-color:var(--accent)}
.drawer{width:332px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;min-height:0}
.drawer.closed{display:none}
.dh{display:flex;align-items:center;padding:16px 18px 6px}.dh h2{font-size:17px;margin:0;color:var(--strong);font-weight:800}.dh .x{margin-left:auto;width:32px;height:32px;border-radius:8px;color:var(--muted)}.dh .x:hover{background:var(--panel2)}
.db{padding:6px 18px 40px;overflow-y:auto;flex:1}
.stage{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:18px 12px;gap:10px;position:relative}
.frame{background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.25);border:8px solid #111;overflow:hidden;transform-origin:top center;flex-shrink:0}
.frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.hint{font-size:12.5px;color:var(--muted);margin:0;text-align:center}
.tip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--strong);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:700;font-size:13px;display:flex;gap:10px;align-items:center;z-index:5;max-width:92%;box-shadow:0 8px 24px rgba(0,0,0,.25)}.tip button{font-weight:800;opacity:.8}
.sec{margin:16px 0 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.sec:first-child{margin-top:6px}
.note{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5}
.lockbar{font-size:12.5px;font-weight:700;color:var(--warn);background:var(--panel2);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin-bottom:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 9px;border:2px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--strong);font-size:12px;font-weight:700;text-align:center}
.tile svg{width:48px;height:32px;color:var(--strong)}.tile:hover{border-color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile:disabled{opacity:.45;cursor:default}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl button{text-align:left;border:2px solid var(--border);border-radius:12px;padding:0;background:var(--panel2);overflow:hidden}.tpl button:hover{border-color:var(--muted)}
.tpl .sw3{display:flex;height:34px}.tpl .sw3 i{flex:1}
.tpl b{display:block;color:var(--strong);font-size:13px;padding:8px 10px 0}.tpl span{display:block;font-size:11.5px;color:var(--muted);padding:0 10px 9px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.pal button{aspect-ratio:1;border-radius:50%;border:2px solid var(--border);box-shadow:inset 0 0 0 2px var(--panel)}.pal button[aria-pressed="true"]{border-color:var(--strong)}
.pals{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pals button{border:2px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel2);padding:0}.pals .sw3{display:flex;height:26px}.pals .sw3 i{flex:1}.pals span{display:block;font-size:11.5px;font-weight:700;padding:5px 8px;color:var(--strong);text-align:left}
.cw{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);padding:6px 10px 6px 6px;margin-bottom:8px;font-weight:700;color:var(--strong);font-size:13px}
.cw input{width:36px;height:36px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer}.cw small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.warn{font-size:12px;color:var(--warn);margin:6px 0 0;font-weight:700}
.fld{margin-bottom:14px}.fld>label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.fld input[type=text],.fld select,.fld textarea{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--strong);font:inherit}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld input[type=range]{width:100%;accent-color:var(--accent)}
.fonts{display:grid;gap:8px;margin-bottom:8px}.fonts button{padding:11px 14px;border:2px solid var(--border);border-radius:12px;background:var(--panel2);text-align:left;font-size:19px;color:var(--strong);display:flex;align-items:center;gap:10px}.fonts button small{font-family:Inter,sans-serif;font-size:11px;color:var(--muted);margin-left:auto}.fonts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}.fonts button:disabled{opacity:.5}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--border);font-weight:600;color:var(--strong)}.sw input{width:22px;height:22px;accent-color:var(--accent)}
.media{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--panel2)}
.media .th{width:64px;height:64px;border-radius:10px;background:var(--panel);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;overflow:hidden;flex-shrink:0;text-align:center}.media .th img{width:100%;height:100%;object-fit:cover}
.media.wide .th{width:96px}.media .mb{flex:1;min-width:0}.media b{display:block;color:var(--strong);margin-bottom:6px}.media .row{display:flex;gap:6px;flex-wrap:wrap}.media .btn{min-height:34px;padding:0 12px;font-size:12px}
.pl{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}.pl li{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--panel2)}.pl .pt{width:42px;height:42px;border-radius:8px;background:var(--panel);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px}
.pl .pn{flex:1;min-width:0;font-weight:700;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl .pn small{display:block;color:var(--muted);font-weight:600}.pl a{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
.empty{text-align:center;padding:22px 10px;border:2px dashed var(--border);border-radius:14px;margin-bottom:14px}.empty .em{font-size:34px}.empty b{display:block;color:var(--strong);margin:6px 0 4px}.empty p{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
ul.bl{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
ul.bl li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);font-weight:700;color:var(--strong);cursor:grab}
ul.bl li.off{opacity:.55}ul.bl li.drag{opacity:.4}ul.bl li .mv{margin-left:auto;display:flex;gap:4px}
ul.bl li .mv button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel)}ul.bl li .mv button:disabled{opacity:.3}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--strong);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:95;max-width:90vw;text-align:center}#toast.show{opacity:1}
@media (max-width:900px){
  body{overflow:auto}.wrap{flex-direction:column;position:relative}
  .rail{position:fixed;left:0;right:0;bottom:0;width:auto;height:66px;flex-direction:row;padding:0;z-index:60;overflow-x:auto;justify-content:flex-start}
  .rail button{flex:1;min-width:70px;border-left:0;border-top:3px solid transparent;padding:8px 2px}.rail button[aria-pressed="true"]{border-left-color:transparent;border-top-color:var(--accent)}
  .drawer{position:fixed;left:0;right:0;bottom:66px;width:auto;max-height:42vh;z-index:55;border-right:0;border-top:1px solid var(--border);box-shadow:0 -10px 30px rgba(0,0,0,.18);border-radius:18px 18px 0 0}
  .tip{display:none !important}.stage{padding:8px 8px 80px}.top{flex-wrap:wrap;padding:8px 10px;gap:6px}.top h1 small,#dev,.hint{display:none}#saveState{order:9;flex-basis:100%;font-size:12px}.clean{font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="gate"><strong style="color:var(--strong);font-size:18px">Cargando el editor…</strong><span id="gateMsg" style="color:var(--muted)"></span></div>
<div id="app">
  <header class="top">
    <a class="back" href="/dashboard.html#personalizar">← Panel</a>
    <h1>Editor visual<small id="bizTitle"></small></h1>
    <button class="ib" id="undo" aria-label="Deshacer (Ctrl+Z)" title="Deshacer (Ctrl+Z)" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="redo" aria-label="Rehacer (Ctrl+Shift+Z)" title="Rehacer (Ctrl+Shift+Z)" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <label class="clean" title="Oculta los recuadros azules para ver el menú exactamente como lo ve el cliente"><input type="checkbox" id="clean"><span>Vista del cliente</span></label>
    <div class="seg" id="dev" role="group" aria-label="Tamaño de pantalla"><button data-d="mobile" aria-pressed="true">Móvil</button><button data-d="tablet" aria-pressed="false">Tablet</button><button data-d="desktop" aria-pressed="false">PC</button></div>
    <div id="saveState" role="status" aria-live="polite">—</div>
    <a class="btn" id="viewPub" href="#" target="_blank" rel="noopener" title="Abre tu menú tal como lo ven los clientes">Ver menú público ↗</a>
    <button class="btn" id="discard" title="Volver al diseño que está publicado">Descartar</button>
    <button class="btn primary" id="publish">Publicar</button>
  </header>
  <div class="banner" id="pubBanner"><span>Tu menú todavía no está publicado: los clientes no lo verán aunque publiques el diseño.</span><button class="btn primary" id="pubMenu">Publicar mi menú</button></div>
  <main class="wrap">
    <nav class="rail" id="rail" aria-label="Herramientas"></nav>
    <aside class="drawer" id="drawer" aria-label="Opciones"><div class="dh"><h2 id="dTitle"></h2><button class="x" id="dClose" aria-label="Cerrar panel">✕</button></div><div class="db" id="dBody"></div></aside>
    <section class="stage" id="stage">
      <div class="tip" id="tip"><span>👋 Elige una herramienta a la izquierda o toca cualquier parte del menú para editarla.</span><button id="tipX" aria-label="Cerrar consejo">✕</button></div>
      <div class="frame" id="frame"><iframe id="pv" title="Vista previa de tu menú" src="/menu.html?preview=1"></iframe></div>
      <p class="hint">Esto es tu menú real: así lo verán tus clientes.</p>
    </section>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="/menu-design.js"></script>
<script type="module">

const D = window.KARTTA_DESIGN, $ = (id) => document.getElementById(id), BUCKET = 'kartta-media';

/* ---------- iconos ---------- */
const I = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

};
const OPT = {
  headerStyle: ['Encabezado', [['banner', 'Banner'], ['compact', 'Compacto'], ['centered', 'Centrado'], ['minimal', 'Minimal']]],
  itemLayout: ['Cómo se ven los productos', [['list', 'Lista'], ['cards', 'Tarjetas'], ['grid', 'Cuadrícula']]],
  imageShape: ['Forma de las fotos', [['square', 'Cuadrada'], ['rounded', 'Redondeada'], ['circle', 'Círculo']]],
  imagePosition: ['Lugar de la foto', [['left', 'Izquierda'], ['right', 'Derecha']]],
  navStyle: ['Estilo de las categorías', [['pills', 'Botones'], ['underline', 'Subrayado']]],

};
$('discard').onclick = () => { if (snapJSON() === JSON.stringify(D.compact(published))) return toast('No hay cambios sin publicar.'); if (!confirm('¿Volver al diseño publicado? Puedes deshacerlo con Ctrl+Z.')) return; replace(published, 'Volviste al diseño publicado'); };
$('pubMenu').onclick = async () => { const { error } = await sb.from('restaurants').update({ is_published: true }).eq('id', rid); if (error) return toast('No se pudo publicar tu menú.'); menuPublished = true; $('pubBanner').classList.remove('show'); toast('Tu menú ya está publicado.'); };

/* ---------- datos y arranque ---------- */
async function loadCatalog(){
  const [c, p] = await Promise.all([sb.from('categories').select('id,name,sort_order').eq('restaurant_id', rid).order('sort_order'), sb.from('products').select('id,category_id,name,description,price,discount_percent,image_path,is_available,sort_order').eq('restaurant_id', rid).eq('is_active', true).order('sort_order')]);
  cats = c.data || []; prods = p.data || [];
}
addEventListener('focus', async () => { if (!booted) return; try { await loadCatalog(); sendData(); if (tool === 'products') openTool('products'); } catch {} });
async function boot(user){
  try {
    const mem = await sb.from('restaurant_members').select('restaurant_id,role').eq('user_id', user.uid).order('created_at').limit(1);
    if (!mem.data || !mem.data.length) throw new Error('sin_negocio'); if (!['owner', 'admin'].includes(mem.data[0].role)) throw new Error('sin_permiso');
    rid = mem.data[0].restaurant_id;
    const [r, sub, ds] = await Promise.all([sb.from('restaurants').select('name,slug,address,logo_path,cover_path,is_published').eq('id', rid).single(), sb.from('subscriptions').select('plan_id,status,current_period_end').eq('restaurant_id', rid).maybeSingle(), sb.from('menu_designs').select('status,config').eq('restaurant_id', rid)]);
    if (r.error) throw r.error; restaurant = r.data; $('viewPub').href = location.origin + '/m/' + encodeURIComponent(restaurant.slug); $('bizTitle').textContent = '· ' + (restaurant.name || '');
    const s = sub.data, vig = s && ['active', 'trialing'].includes(s.status) && (!s.current_period_end || new Date(s.current_period_end) > new Date());
    if (vig) { const p = await sb.from('plans').select('limits').eq('id', s.plan_id).maybeSingle(); rank = Number(p.data?.limits?.rank || 0); }
    const rows = ds.data || [], draft = rows.find(x => x.status === 'draft'), pub = rows.find(x => x.status === 'published');
    published = D.normalize(pub ? pub.config : {}); cfg = D.normalize(draft ? draft.config : (pub ? pub.config : {})); lastSaved = draft ? JSON.stringify(D.compact(draft.config)) : '';
    await loadCatalog(); menuPublished = !!restaurant.is_published; $('pubBanner').classList.toggle('show', !menuPublished);
    buildRail(); hist = [JSON.stringify(cfg)]; hi = 0; booted = true;
    const want = (location.hash || '').slice(1); openTool(TOOLS.some(t => t[0] === want) ? want : (matchMedia('(max-width:900px)').matches ? null : 'design')); renderState();
    $('gate').classList.add('hidden'); $('app').classList.add('ready'); fit(); if (previewReady) sendData();
  } catch (e) { console.error(e); $('gateMsg').textContent = e.message === 'sin_permiso' ? 'Solo el dueño o un administrador puede usar el editor.' : e.message === 'sin_negocio' ? 'Tu cuenta no tiene un negocio asociado todavía.' : 'No pudimos cargar el editor. Revisa tu conexión.'; }
}
let started = false;
window.KARTTA_AUTH.onChange(user => { if (!user) { location.href = '/index.html'; return; } if (started) return; started = true; boot(user); });
</script>
