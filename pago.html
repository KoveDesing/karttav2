<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Resultado del pago — KARTTA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.png">
<style>
:root{--bg:#121212;--card:#202020;--field:#292929;--ink:#f4f4f4;--mut:#a8a8a8;--accent:#ff6b57;--ok:#2ecc71;--warn:#f5b942;--bad:#ff5a5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
.c{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:32px 24px;text-align:center}
.i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:30px;background:var(--field)}
h1{font-size:22px;margin:0 0 8px}p{color:var(--mut);margin:0 0 6px}b{color:var(--ink)}
.ok .i{color:var(--ok)}.warn .i{color:var(--warn)}.bad .i{color:var(--bad)}
a.b,button{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:600 15px inherit;cursor:pointer;text-decoration:none}
.brand{margin-top:22px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<main class="c" id="app" aria-live="polite"><div class="i">…</div><h1>Confirmando tu pago</h1><p>Un momento, estamos verificando con Wompi.</p></main>
<script>
(function () {
  'use strict';
  var FN = 'https://ifbvdjvukygvvgiyzgav.supabase.co/functions/v1/order-checkout';
  var m = location.pathname.match(/\/pago\/(KO-[A-Fa-f0-9]{20})/), ref = m ? m[1].toUpperCase() : '';
  var id = new URLSearchParams(location.search).get('id') || '';
  var app = document.getElementById('app'), tries = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function show(cls, icon, title, msg, d, retry) {
    var back = d && d.slug ? '<a class="b" href="/m/' + encodeURIComponent(d.slug) + '">Volver al menú</a>' : '';
    app.className = 'c ' + cls;
    app.innerHTML = '<div class="i">' + icon + '</div><h1>' + esc(title) + '</h1><p>' + msg + '</p>' + (retry ? '<button id="r">Reintentar</button>' : '') + back + '<div class="brand">Pago procesado con Wompi · KARTTA</div>';
    var r = document.getElementById('r'); if (r) r.onclick = function () { tries = 0; check(); };
  }
  async function check() {
    if (!ref) return show('bad', '!', 'Enlace no válido', 'No encontramos este pago.');
    try {
      var res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'verify', reference: ref, id: id || null }) });
      var d = await res.json().catch(function () { return {}; });
      if (res.status === 404) return show('bad', '!', 'Pago no encontrado', 'Esta referencia no existe.');
      if (res.status === 503 || res.status >= 500) return show('warn', '⏳', 'Seguimos verificando', 'No pudimos consultar a Wompi todavía. Tu dinero está seguro; el restaurante verá el pago en cuanto Wompi lo confirme.', d, true);
      var code = d.order_code ? '<br>Pedido <b>#' + esc(d.order_code) + '</b>' : '';
      var amt = d.amount_in_cents ? ' por <b>$' + Math.round(d.amount_in_cents / 100).toLocaleString('es-CO') + '</b>' : '';
      if (d.status === 'approved') return show('ok', '✓', '¡Pago aprobado!', 'Recibimos tu pago' + amt + '.' + code, d);
      if (d.status === 'declined') return show('bad', '✕', 'Pago rechazado', 'Tu banco o Wompi no aprobó el pago. No se te cobró. Puedes intentarlo de nuevo desde el menú o pagar en la mesa.' + code, d);
      if (d.status === 'pending') {
        if (++tries < 8) { show('warn', '⏳', 'Pago en proceso', 'Estamos esperando la confirmación de tu banco.' + code, d); return setTimeout(check, 4000); }
        return show('warn', '⏳', 'Pago en proceso', 'Tu banco aún no confirma. Cuando lo haga, el restaurante lo verá automáticamente.' + code, d, true);
      }
      show('warn', '!', 'No pudimos confirmar', 'Habla con el personal del restaurante para validar tu pedido.' + code, d, true);
    } catch (e) { show('warn', '⏳', 'Sin conexión', 'Revisa tu internet e intenta de nuevo.', null, true); }
  }
  check();
})();
</script>
</body>
</html>
